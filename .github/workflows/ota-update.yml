name: OTA Update

# main branch e push korle automatic JS update publish hobe
on:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Publish OTA update
        run: npx --yes eas-cli@latest update --channel preview --message "${{ github.event.head_commit.message }}" --non-interactive
